name: Build StardustPvP

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Set up Gradle 2.14.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '2.14.1'
      - name: Build
        run: gradle --no-daemon build
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: StardustPvP
          path: build/libs/*.jar
          if-no-files-found: error
