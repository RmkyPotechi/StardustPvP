name: Build StardustPvP

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 8
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'
          cache: gradle

      # ForgeGradle 2.1 / Minecraft 1.8.9 is an intentionally old build
      # stack. Install the matching Gradle distribution directly instead of
      # using a modern Gradle setup action.
      - name: Install Gradle 2.14.1
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-2.14.1-bin.zip
          unzip -q /tmp/gradle.zip -d "$HOME/.gradle-dist"
          echo "$HOME/.gradle-dist/gradle-2.14.1/bin" >> "$GITHUB_PATH"
          "$HOME/.gradle-dist/gradle-2.14.1/bin/gradle" --version

      - name: Build
        run: gradle --no-daemon build

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: StardustPvP
          path: build/libs/*.jar
          if-no-files-found: error
